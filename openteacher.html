<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;}
:root{--bg:#0a0e1a;--card-bg:rgba(255,255,255,0.04);--card-border:rgba(255,255,255,0.08);--card-hover-border:rgba(255,255,255,0.15);--text:#e2e8f0;--text-light:#94a3b8;--text-muted:#64748b;--primary:#3b82f6;--primary-light:#60a5fa;--success:#22c55e;--success-bg:rgba(34,197,94,0.1);--accent:#8b5cf6;--radius:16px;--radius-sm:10px;--shadow:0 8px 40px rgba(0,0,0,0.3)}
body{background:var(--bg);color:var(--text);padding-bottom:80px;min-height:100vh;background:radial-gradient(ellipse at 20% 50%,#0f1a2e 0%,#0a0e1a 50%,#0a0e1a 100%)}
.header{background:linear-gradient(135deg,rgba(59,130,246,0.15),rgba(139,92,246,0.1));color:var(--text);padding:16px;text-align:center;position:relative;border-bottom:1px solid rgba(255,255,255,0.06);backdrop-filter:blur(12px)}
.header h1{font-size:18px;font-weight:600;background:linear-gradient(135deg,#60a5fa,#34d399);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.header p{font-size:12px;opacity:.7;margin-top:2px;color:var(--text-light)}
.tab-bar{display:flex;background:rgba(255,255,255,0.03);border-bottom:1px solid rgba(255,255,255,0.06);overflow-x:auto;position:sticky;top:0;z-index:20;backdrop-filter:blur(12px)}
.tab-btn{flex:1;min-width:64px;padding:10px 4px;font-size:12px;border:0;background:0;color:var(--text-muted);cursor:pointer;text-align:center;border-bottom:3px solid transparent;transition:.2s}
.tab-btn.active{color:var(--primary-light);border-bottom-color:var(--primary);font-weight:600}
.tab-content{display:none;padding:12px;max-width:640px;margin:0 auto}
.tab-content.active{display:block}
.card{background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--radius);padding:16px;margin-bottom:12px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.card h3{font-size:15px;margin-bottom:8px;color:var(--text)}
.card p{font-size:14px;color:var(--text-light);line-height:1.7}
.badge{display:inline-block;background:rgba(59,130,246,0.12);color:var(--primary-light);padding:2px 10px;border-radius:20px;font-size:11px;font-weight:500;border:1px solid rgba(59,130,246,0.2)}
.btn{display:block;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;border:0;border-radius:var(--radius-sm);padding:12px;font-size:14px;font-weight:500;cursor:pointer;width:100%;text-align:center;transition:.2s;margin-top:10px;position:relative;overflow:hidden}

.btn-outline{background:0;border:1.5px solid var(--primary);color:var(--primary-light)}
.btn-sm{display:inline-block;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:6px 14px;font-size:12px;cursor:pointer;color:var(--text-light);transition:.15s}
.btn-sm:active{background:rgba(255,255,255,0.1)}
.btn-print{background:linear-gradient(135deg,#059669,#10b981);color:#fff;border:0;border-radius:var(--radius-sm);padding:12px;font-size:14px;font-weight:500;cursor:pointer;width:100%;text-align:center;transition:.2s;margin-top:10px}
.btn-print:active{transform:scale(.97);opacity:.85}

textarea:focus,input:focus,select:focus{transform:translateY(-1px);box-shadow:0 2px 8px rgba(59,130,246,.15);}

.modal-actions{display:flex;gap:8px;margin-top:16px;padding-top:12px;border-top:1px solid rgba(255,255,255,0.06)}
.modal-actions .modal-btn{flex:1;padding:10px 12px;border-radius:10px;font-size:13px;font-weight:500;cursor:pointer;text-align:center;transition:.2s;border:0}

.modal-btn-primary{background:linear-gradient(135deg,#1d4ed8,#6d28d9);color:#fff}

<script>
// ============================================================
// SYSTEM_ANALYZE — 重构版（分题型难度规则 + 计算题专属处理）
// ============================================================
const SYSTEM_ANALYZE = `你是一位资深小学数学教研专家。你的任务是**严格根据用户指定的参数**生成高质量数学题。

## 一、核心原则
1. **参数为准**：用户会提供年级、单元、知识点、题型、难度等信息，你出的每一道题都必须精准落在这些参数范围内，绝不超纲或偏离。
2. **知识点准确性**：你对人教版小学1-6年级教材非常熟悉，确保题目对应的知识点与用户给出的单元/知识点标签一致。
3. **时政/生活化（仅应用题）**：应用题应尽可能贴合真实生活或时政场景，但计算题、填空题、选择题不做此要求。

## 二、难度标准（分题型）
### 通用难度（应用题、选择题、填空题）
- ★☆☆☆☆：一步计算，直接套用公式或概念
- ★★☆☆☆：两步计算，简单转换
- ★★★☆☆：多步计算，需分析数量关系，阅读量约60~90字
- ★★★★☆：逆向思维或隐含条件，阅读量约90~130字
- ★★★★★：综合多知识点，有陷阱需要辨析，阅读量约130~200字

### 计算题专属难度（只看算式复杂度，不看字数）
- ★☆☆☆☆：同级一步运算（如两位数加两位数、表内乘除法）
- ★★☆☆☆：两步同级或一步混合（如乘加、乘减、带余数除法）
- ★★★☆☆：三步以上混合运算，含括号或运算律应用
- ★★★★☆：多位数乘除法（需列竖式）、小数/分数四则运算、简便运算
- ★★★★★：复杂混合运算，包含小数、分数、百分数转换或巧算技巧
**注意：计算题只输出纯算式，不加任何背景、单位、故事。**

## 三、输出格式（严格JSON）
{
  "grade": "给定年级",
  "unit": "给定单元",
  "knowledge_point": "给定知识点",
  "difficulty": "给定难度（如★★★☆☆）",
  "questions": [
    {
      "id": 1,
      "type": "题型（应用题/计算题/选择题/填空题）",
      "content": "题目内容（计算题只写算式，不用加单位）",
      "options": ["仅选择题提供，选项A", "选项B", "选项C", "选项D"],
      "hint": "解题提示",
      "answer": "最终答案",
      "steps": ["分步1", "分步2", "..."]
    }
  ]
}
注意：如果题型是计算题，则“options”字段省略；“content”就是纯算式（如“1234 × 5678”）；“steps”拆解计算过程。若题型是选择题，则必须包含“options”数组，且至少4个选项。`;

// ============================================================
// 演示题库

const DEMO_PROBLEMS = [
  {grade:'三年级',unit:'倍的认识',knowledge:'倍数关系（标准量不变）',difficulty:'★★★☆☆',problem:'商店里有 8 个红气球，蓝气球的个数是红气球的 3 倍。蓝气球有多少个？',steps:['找标准量：红气球 8 个是标准量（1 份）','倍数关系：蓝气球是红气球的 3 倍','列式计算：8 × 3 = 24（个）','答：蓝气球有 24 个'],answer:'24 个',hint:'注意谁是标准量（1 份），求几倍用乘法'},
  {grade:'三年级',unit:'倍的认识',knowledge:'倍数关系（标准量不变）',difficulty:'★★★★☆',problem:'小明有 5 本故事书，科技书的本数是故事书的 4 倍。科技书比故事书多多少本？',steps:['标准量：故事书 5 本','科技书：5 × 4 = 20（本）','求多多少：20 − 5 = 15（本）','答：科技书比故事书多 15 本'],answer:'15 本',hint:'先求出科技书数量，再求差'},
  {grade:'三年级',unit:'倍的认识',knowledge:'倍数关系（标准量不变）',difficulty:'★★★★☆',problem:'果园里有 6 棵桃树，梨树的棵数是桃树的 2 倍，苹果树的棵数是桃树的 3 倍。梨树和苹果树一共有多少棵？',steps:['标准量：桃树 6 棵','梨树：6 × 2 = 12（棵）','苹果树：6 × 3 = 18（棵）','总数：12 + 18 = 30（棵）','答：梨树和苹果树一共有 30 棵'],answer:'30 棵',hint:'分别求出两种树的数量再相加'}

const BUILTIN_QUESTIONS = [

function getLocalBank() {
  try {
    const stored = JSON.parse(localStorage.getItem('openteacher_local_bank') || '[]');
    // 合并内置题库 + 本地新增
    const all = [...BUILTIN_QUESTIONS, ...stored];
    // 去重（按题目内容）
    const seen = new Set();
    return all.filter(q => {
      const key = q.question;
      if(seen.has(key)) return false;
      seen.add(key);
      return true;
    });
  } catch(e) { return BUILTIN_QUESTIONS; }
}
function saveLocalBank(questions) {
  // 只保存自定义新增的题目（内置题不重复存）
  const existingTexts = new Set(BUILTIN_QUESTIONS.map(q => q.question));
  const custom = questions.filter(q => !existingTexts.has(q.question));
  localStorage.setItem('openteacher_local_bank', JSON.stringify(custom));
}
function addToLocalBank(q) {
  const bank = getLocalBank();
  const exists = bank.some(b => b.question === q.question);
  if(exists) return false;
  bank.push(q);
  saveLocalBank(bank);
  return true;
}
function nextLocalId() {
  const bank = getLocalBank();
  return bank.length > 0 ? Math.max(...bank.map(q => q.id)) + 1 : 100;
}

const API_CACHE = new Map();
function getCacheKey(messages){
  return messages.map(m=>m.role+':'+m.content.slice(0,40)).join('|');
}
async function callAPIRaw(messages, modelName){
  modelName = modelName || 'deepseek-v4-pro';
  const cacheKey = getCacheKey(messages);
  const cached = API_CACHE.get(cacheKey);
  if(cached && Date.now()-cached.time < 15*60*1000) return cached.data;
  try{
    const controller = new AbortController();
    const timer = setTimeout(()=>controller.abort(), 20000);
    const resp=await fetch('https://api.deepseek.com/chat/completions',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+getApiKey()},
      body:JSON.stringify({model:modelName,messages,stream:false,temperature:0.8,max_tokens:8192}),
      signal:controller.signal
    });
    clearTimeout(timer);
    if(!resp.ok){ toast('请求失败 ('+resp.status+')'); return null; }
    const data=await resp.json();
    let content=data.choices[0].message.content;
    if(!content && data.choices[0].message.reasoning_content){
      const m=data.choices[0].message.reasoning_content.match(/\{[\s\S]*\}/);
      if(m) content=m[0];
    }
    let json=null;
    try{json=JSON.parse(content.replace(/^```json\s*/,'').replace(/\s*```$/,'').trim());}catch(e){}
    if(!json){ const m=content.match(/\{[\s\S]*\}/); if(m) try{json=JSON.parse(m[0]);}catch(e2){} }
    if(!json) throw new Error('格式异常');
    API_CACHE.set(cacheKey, {data:json, time:Date.now()});
    return json;
  }catch(e){
    if(e.name==='AbortError'){ toast('请求超时，可稍后重试'); return null; }
    toast('AI 返回格式异常'); return null;
  }
}

async function callAPI(messages,tabId){
  return callAPIWithModel('deepseek-v4-pro', messages, tabId);
}

async function callAPIWithModel(model, messages, tabId){
  const tab=document.getElementById('tab-'+tabId);
  const isGenerate = tabId==='math-generate';

  // 缓存检查
  const cacheKey = getCacheKey(messages);
  const cached = API_CACHE.get(cacheKey);
  if(cached && Date.now()-cached.time < 15*60*1000){
    const json = cached.data;
    if(tabId === 'math-analyze' && (!json.questions || !json.questions.length)){
      renderAnalyzeResult(tabId, json, 'DeepSeek AI');
    } else {
      renderResult(tabId,json,'DeepSeek AI');
    }
    return json;
  }

  // 分步进度显示
  const steps = isGenerate
    ? ['🔄 正在连接 AI…', '📝 正在生成题目…', '✅ 解析结果中…']
    : ['🔄 正在连接 AI…', '💭 AI 思考中…', '✅ 解析结果中…'];

  tab.innerHTML=`<div class="loading-box" id="loading-${tabId}">
    <div class="spinner"></div>
    <div class="msg" id="status-${tabId}">${steps[0]}</div>
    <div class="progress-bar" id="progress-${tabId}" style="margin-top:12px;height:4px;background:rgba(255,255,255,0.08);border-radius:4px;overflow:hidden">
      <div style="width:0%;height:100%;background:linear-gradient(90deg,#3b82f6,#8b5cf6);border-radius:4px;transition:width 2s ease" id="bar-${tabId}"></div>
    </div>
  </div>`;

  function setStatus(idx){
    const el = document.getElementById('status-'+tabId);
    if(el) el.textContent = steps[idx] || steps[steps.length-1];
    const bar = document.getElementById('bar-'+tabId);
    if(bar) bar.style.width = (idx+1)*(100/steps.length)+'%';
  }

  setStatus(0);
  await sleep(600);
  setStatus(1);

  // 尝试请求（最多重试 2 次）
  let lastError = null;
  for(let attempt=0; attempt<2; attempt++){
    if(attempt>0){
      setStatus(1);
      document.getElementById('status-'+tabId).textContent = `🔄 重试第 ${attempt+1} 次…`;
    }
    try{
      const controller = new AbortController();
      const timer = setTimeout(()=>controller.abort(), 25000);
      const resp=await fetch('https://api.deepseek.com/chat/completions',{
        method:'POST',
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+getApiKey()},
        body:JSON.stringify({model:model,messages,stream:false,temperature:0.8,max_tokens:8192}),
        signal:controller.signal
      });
      clearTimeout(timer);
      if(!resp.ok){
        let errTxt='请求失败 ('+resp.status+')';
        try{const e=await resp.json();errTxt=e.error?.message||errTxt;}catch(e){errTxt=await resp.text()}
        if(resp.status===429 || resp.status>=500){
          lastError = errTxt;
          await sleep(1500);
          continue;
        }
        tab.innerHTML=`<div class="card"><h3>❌ 出错了</h3><p>${errTxt}</p><button class="btn" onclick="renderAll();switchTab('${tabId}')">重试</button></div>`;
        return null;
      }
      setStatus(2);
      const data=await resp.json();
      let content=data.choices[0].message.content;
      // 如果 content 为空但 reasoning_content 有内容（DeepSeek v4-pro 特性）
      if(!content && data.choices[0].message.reasoning_content){
        const rc = data.choices[0].message.reasoning_content;
        const m = rc.match(/\{[\s\S]*\}/);
        if(m) content = m[0];
      }
      let json=null;
      try{json=JSON.parse(content.replace(/^```json\s*/,'').replace(/\s*```$/,'').trim());}catch(e){}
      if(!json){
        const matches = content.match(/\{[\s\S]*\}/);
        if(matches) try{json=JSON.parse(matches[0]);}catch(e2){}
      }
      if(!json) throw new Error('AI 返回格式异常，请重试');
      // 统一处理：标准化 JSON 字段
      if(json.questions){
        json.questions = json.questions.map((q,i) => {
          if((q.type||'').includes('选择') && (!q.options || !q.options.length)){
            q.options = ['A. 选项A','B. 选项B','C. 选项C','D. 选项D'];
          }
          return {
            id: q.id || i+1,
            type: q.type || '应用题',
            content: q.content || q.text || q.question || '',
            options: q.options || [],
            hint: q.hint || '',
            answer: q.answer || '',
            steps: q.steps || []
          };
        });
      }
      if(json.problems && !json.questions){
        json.questions = (json.problems||[]).map((p,i) => ({
          id: i+1, type: '应用题',
          content: typeof p === 'string' ? p : p.content || p.question || p.text || '',
          hint: p.hint || '',
          answer: p.answer || '',
          steps: p.steps || []
        }));
      }
      // 缓存
      API_CACHE.set(cacheKey, {data:json, time:Date.now()});
      // 渲染
      if(tabId === 'math-analyze' && (!json.questions || !json.questions.length)){
        renderAnalyzeResult(tabId, json, 'DeepSeek AI');
      } else {
        renderResult(tabId,json,'DeepSeek AI');
      }
      return json;
    }catch(e){
      if(e.name==='AbortError'){
        lastError = '连接超时（AI 响应太慢）';
      } else {
        lastError = e.message;
      }
      if(attempt===0) await sleep(1200);
    }
  }
  // 两次都失败
  tab.innerHTML=`<div class="card"><h3>❌ 请求失败</h3><p>${lastError}</p>
    <p style="font-size:12px;color:var(--text-muted);margin-top:4px">💡 DeepSeek 高峰期可能较慢，约 5~15 秒。请稍后重试。</p>
    <button class="btn" onclick="renderAll();switchTab('${tabId}')">重试</button></div>`;
  return null;
}

function autoImport(data){
  const el=document.getElementById('importStatus');
  if(!el) return;

  // 兼容各种字段名
  const grade = data.grade || data.年级 || data.grade_name || '';
  const unit = data.unit || data.单元 || data.unit_name || '';
  const knowledge = data.knowledge_point || data.knowledge || data.知识点 || data.knowledge_name || '';
  const difficulty = data.difficulty || data.难度 || '★★★';
  const background = data.background || data.背景 || data.topic || '';
  const news_bg = data.news_bg || data.时政背景 || '';

  let qs = data.questions || data.问题 || data.problems || [];
  if(typeof qs === 'string') {
    try{ qs = JSON.parse(qs); }catch(e){}
  }
  if(!Array.isArray(qs)) qs = [];

  let imported = 0;
  let skipped = 0;

  qs.forEach(q => {
    if(typeof q === 'string') {
      q = {content: q, answer: '', type: '应用题'};
    }
    const qtext = q.content || q.question || q.题目 || q.text || q.题干 || '';
    const answer = q.answer || q.答案 || '';
    if(!qtext) { skipped++; return; }
    const qtype = q.type || q.题型 || '应用题';

    const newQ = {
      id: nextLocalId(),
      grade: grade,
      unit: unit,
      knowledge: knowledge,
      type: qtype,
      difficulty: difficulty,
      question: qtext,
      answer: answer,
      background: background,
      news_bg: news_bg,
      source: 'AI生成',
      created_at: new Date().toLocaleString()
    };

    if(addToLocalBank(newQ)) {
      imported++;
    } else {
      skipped++;
    }
  });

  if(imported>0){
    el.innerHTML=`<span style="color:#059669">✅ 已保存 ${imported} 题到本地题库（共 ${getLocalBank().length} 题）</span>`;
    // 自动上传到云端
    setTimeout(()=>syncToGist(true), 500);
  } else if(skipped>0){
    el.innerHTML=`<span style="color:#f59e0b">⚠️ 已有 ${skipped} 道重复题，未重复入库</span>`;
  } else {
    el.innerHTML=`<span style="color:var(--text-muted)">ℹ️ 没有新题需要入库</span>`;
  }
}

function regenerate(tabId){
  let inputs = {};
  switch(tabId){
    case 'math-analyze':
      inputs.val = document.getElementById('analyzeInput')?.value || '';
      renderAnalyze();
      setTimeout(()=>{ document.getElementById('analyzeInput').value = inputs.val; doAnalyze(); }, 50);
      break;
    case 'math-generate':
      ['genGrade','genDifficulty','genBackground','genUnit','genKnowledge','genCount'].forEach(id => {
        const el = document.getElementById(id); if(el) inputs[id] = el.value;
      });
      // 保存题型选择
      inputs._types = getSelectedTypes();
      renderGenerate();
      setTimeout(()=>{
        ['genGrade','genDifficulty','genBackground','genUnit','genKnowledge','genCount'].forEach(id => {
          const el = document.getElementById(id); if(el && inputs[id]!==undefined) el.value = inputs[id];
        });
        // 恢复题型选择
        if(inputs._types && inputs._types.length){
          document.querySelectorAll('#genTypes .type-chip').forEach(el => {
            const shouldSelect = inputs._types.includes(el.dataset.type);
            el.classList.toggle('selected', shouldSelect);
            el.style.borderColor = shouldSelect ? 'var(--primary)' : 'rgba(255,255,255,0.12)';
            el.style.background = shouldSelect ? 'rgba(59,130,246,0.15)' : 'rgba(255,255,255,0.05)';
            el.style.color = shouldSelect ? 'var(--primary-light)' : 'var(--text-light)';
          });
        }
        doGenerate();
      }, 50);
      break;
    case 'math-solutions':
      inputs.val = document.getElementById('solutionInput')?.value || '';
      renderSolutions();
      setTimeout(()=>{ document.getElementById('solutionInput').value = inputs.val; doSolutions(); }, 50);
      break;
  }
}

function loadUnits(){
  const grade = document.getElementById('genGrade').value;
  const unitSel = document.getElementById('genUnit');
  const knowledgeSel = document.getElementById('genKnowledge');
  unitSel.innerHTML = '<option value="">选择单元</option>';
  knowledgeSel.innerHTML = '<option value="">选择知识点</option>';
  if(!grade || !GRADE_DATA[grade]) return;
  (GRADE_DATA[grade].units||[]).forEach(u => {
    const opt = document.createElement('option');
    opt.value = u.name; opt.textContent = u.name;
    unitSel.appendChild(opt);
  });
}
function loadKnowledge(){
  const grade = document.getElementById('genGrade').value;
  const unitName = document.getElementById('genUnit').value;
  const knowledgeSel = document.getElementById('genKnowledge');
  knowledgeSel.innerHTML = '<option value="">选择知识点</option>';
  if(!grade || !unitName || !GRADE_DATA[grade]) return;
  const unit = (GRADE_DATA[grade].units||[]).find(u => u.name === unitName);
  if(!unit) return;
  (unit.knowledge||[]).forEach(k => {
    const opt = document.createElement('option');
    opt.value = k; opt.textContent = k;
    knowledgeSel.appendChild(opt);
  });
}

// 难度对应的字数范围（阅读量）
const DIFFICULTY_WORD_COUNT = {
  '1': '约 20~40 字',
  '2': '约 40~60 字',
  '3': '约 60~90 字',
  '4': '约 90~130 字',
  '5': '约 130~200 字'
};
function updateReadabilityHint(){
  const d = document.getElementById('genDifficulty').value;
  const hint = document.getElementById('readabilityHint');
  if(d && DIFFICULTY_WORD_COUNT[d]){
    hint.textContent = '📖 阅读量：' + DIFFICULTY_WORD_COUNT[d];
  } else {
    hint.textContent = '';
  }
}
function toggleType(el){
  document.querySelectorAll('#genTypes .type-chip').forEach(other => {
    other.classList.remove('selected');
    other.style.borderColor = 'rgba(255,255,255,0.12)';
    other.style.background = 'rgba(255,255,255,0.05)';
    other.style.color = 'var(--text-light)';
  });
  el.classList.add('selected');
  el.style.borderColor = 'var(--primary)';
  el.style.background = 'rgba(59,130,246,0.15)';
  el.style.color = 'var(--primary-light)';
}
function getSelectedTypes(){
  return Array.from(document.querySelectorAll('#genTypes .type-chip.selected')).map(el => el.dataset.type);
}
function doGenerate(){
  const g=document.getElementById('genGrade').value;
  const d=document.getElementById('genDifficulty').value;
  const b=document.getElementById('genBackground').value.trim();
  const u=document.getElementById('genUnit').value.trim();
  const k=document.getElementById('genKnowledge').value.trim();
  const c=document.getElementById('genCount')?.value || '3';
  const types = getSelectedTypes();
  if(!g){toast('请选择年级');return;}
  if(!types.length){toast('请至少选择一种题型');return;}
  let prompt=`人教版${g}数学 ${c}道${types.join('、')}`;
  if(u) prompt+=` 单元:${u}`;
  if(k) prompt+=` 知识点:${k}`;
  if(d){
    const stars = '★'.repeat(parseInt(d)) + '☆'.repeat(5-parseInt(d));
    const words = DIFFICULTY_WORD_COUNT[d] || '';
    prompt+=` 难度:${stars} 阅读量:${words}`;
  }
  if(b) prompt+=` 背景:${b}`;
  prompt+=' 输出JSON';
  callAPI([{role:'system',content:SYSTEM_ANALYZE},{role:'user',content:prompt}],'math-generate');
}
function doAnalyze(){
  const v=document.getElementById('analyzeInput').value.trim();
  if(!v){toast('请输入题目');return;}

  callAPI([{role:'system',content:SYSTEM_ANALYZE+'\n请先分析这道题，然后基于分析结果生成 3 道同类变式题。输出 JSON。'},{role:'user',content:'分析并生成变式：\n'+v}],'math-analyze');
}
function doSolutions(){
  const v=document.getElementById('solutionInput').value.trim();
  if(!v){toast('请先输入题目');return;}
  callAPI([{role:'system',content:SYSTEM_ANALYZE+'\n请给出分步解题思路和答案，适合小学生理解。只输出 JSON。'},{role:'user',content:'题目：\n'+v}],'math-solutions');
}

// ---- Gist 云端同步 ----
const GIST_ID = 'ab817e548c44aab63f82ce522955697c';

function getGistToken(){
  let t = localStorage.getItem('openteacher_gist_token');
  if(!t) {
    t = prompt('请输入 GitHub Token（用于同步题库到云端）\n去 https://github.com/settings/tokens 创建，勾选 gist 权限');
    if(t) localStorage.setItem('openteacher_gist_token', t);
  }
  return t;
}

function syncStatus(msg, color){
  const el=document.getElementById('syncStatus');
  if(el) el.innerHTML='<span style="color:'+(color||'#94a3b8')+'">'+msg+'</span>';
}

async function syncToGist(silent){
  const token = localStorage.getItem('openteacher_gist_token');
  if(!token) {
    if(!silent) {
      const t = prompt('请输入 GitHub Token（用于同步题库到云端）\n去 https://github.com/settings/tokens 创建，勾选 gist 权限');
      if(t) localStorage.setItem('openteacher_gist_token', t);
    }
    return;
  }
  if(!silent) syncStatus('⏳ 正在上传到云端…','#0ea5e9');
  try {
    const bank = getLocalBank();
    const data = {questions: bank};
    const resp = await fetch('https://api.github.com/gists/'+GIST_ID, {
      method: 'PATCH',
      headers: {'Authorization':'token '+token,'Content-Type':'application/json'},
      body: JSON.stringify({
        description: 'OpenTeacher 题库同步',
        files: {'questions.json': {content: JSON.stringify(data, null, 2)}}
      })
    });
    if(!resp.ok) throw new Error('上传失败 '+resp.status);
    if(!silent) syncStatus('✅ 已上传 '+bank.length+' 题到云端','#059669');
  } catch(e) {
    if(!silent) syncStatus('❌ 同步失败: '+e.message,'#ef4444');
  }
}

async function syncFromGist(silent){
  if(!silent) syncStatus('⏳ 正在从云端下载…','#0ea5e9');
  try {
    // 公开 Gist 可以无 token 读取
    const resp = await fetch('https://api.github.com/gists/'+GIST_ID);
    if(!resp.ok) throw new Error('下载失败 '+resp.status);
    const gist = await resp.json();
    const raw = gist.files['questions.json'].content;
    if(!raw || raw === '[]') {
      syncStatus('ℹ️ 云端暂无数据','#f59e0b');
      return;
    }
    const data = JSON.parse(raw);
    if(!data.questions || !Array.isArray(data.questions)){
      throw new Error('云端数据格式异常');
    }
    const builtinTexts = new Set(BUILTIN_QUESTIONS.map(q => q.question));
    const cloudCustom = data.questions.filter(q => !builtinTexts.has(q.question));
    saveLocalBank(cloudCustom);
    if(cloudCustom.length) {
      bankList(1);
      bankStats();
    }
    if(!silent) {
      syncStatus('✅ 已从云端同步 '+cloudCustom.length+' 题','#059669');
      toast('☁️ 同步完成');
    }
  } catch(e) {
    if(!silent) syncStatus('❌ 同步失败: '+e.message,'#ef4444');
  }
}

    items.forEach(v=>{

      o.value=v;o.textContent=v;
      sel.appendChild(o);
    });
  };
  fill('bankGrade', BUILTIN_GRADES);
  fill('bankType', [...new Set(bank.map(q=>q.type))].filter(Boolean));
  fill('bankDiff', [...new Set(bank.map(q=>q.difficulty))].filter(Boolean));
  fill('bankTopic', [...new Set(bank.map(q=>q.background))].filter(Boolean));
  fill('bankKnowledge', [...new Set(bank.map(q=>q.knowledge))].filter(Boolean));

function bankList(page){
  const grade=document.getElementById('bankGrade')?.value||'';
  const type=document.getElementById('bankType')?.value||'';
  const diff=document.getElementById('bankDiff')?.value||'';
  const topic=document.getElementById('bankTopic')?.value||'';

  const el=document.getElementById('bankList');
  if(!el) return;
  el.innerHTML='';

  let items = getLocalBank();
  if(grade) items = items.filter(q => q.grade === grade);
  if(type) items = items.filter(q => q.type === type);
  if(diff) items = items.filter(q => q.difficulty === diff);
  if(topic) items = items.filter(q => q.background === topic);
  const knowledge=document.getElementById('bankKnowledge')?.value||'';
  if(knowledge) items = items.filter(q => q.knowledge === knowledge);

  const limit = 15;
  const pages = Math.max(1, Math.ceil(items.length / limit));
  page = Math.min(page, pages);
  const offset = (page - 1) * limit;
  // 按难度排序（从易到难）
  items.sort((a,b) => (a.difficulty||'').length - (b.difficulty||'').length);
  const pageItems = items.slice(offset, offset + limit);

  if(!pageItems.length){
    el.innerHTML='<div class="card" style="text-align:center;color:var(--text-muted);padding:30px">📭 没有匹配的题目</div>';
    return;
  }

  let html='<div class="q-list">';
  pageItems.forEach(q=>{
    const stars = q.difficulty.replace(/★/g,'<span style="color:#f59e0b">★</span>').replace(/☆/g,'<span style="color:rgba(255,255,255,0.2)">☆</span>');
    html+='<div class="q-card" style="background:var(--card-bg);border-radius:12px;padding:12px 14px;border:1px solid var(--card-border);border-left:4px solid #22c55e;margin-bottom:6px;position:relative">'
      +'<button style="position:absolute;top:8px;right:8px;background:0;border:0;color:#fca5a5;font-size:16px;cursor:pointer;padding:4px 6px;border-radius:6px;line-height:1" onclick="event.stopPropagation();bankDel('+q.id+')" title="删除">✕</button>'
      +'<button style="position:absolute;top:8px;right:32px;background:0;border:0;color:var(--text-muted);font-size:14px;cursor:pointer;padding:2px 6px;border-radius:6px;line-height:1" onclick="event.stopPropagation();bankEdit('+q.id+',event)" title="编辑">✎</button>'
      +'<div onclick="bankGet('+q.id+',event)" style="cursor:pointer">'
      +'<div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:4px;padding-right:40px">'
      +'<span style="background:#ecfdf5;color:#059669;padding:2px 10px;border-radius:20px;font-size:11px">'+q.grade+'</span>'
      +'<span style="background:rgba(255,255,255,0.05);color:var(--text-light);padding:2px 10px;border-radius:20px;font-size:11px">'+q.unit+'</span>'
      +'<span style="background:rgba(255,255,255,0.05);color:var(--text-light);padding:2px 10px;border-radius:20px;font-size:11px">'+(q.type||'')+'</span>'
      +'<span style="background:rgba(59,130,246,0.12);color:var(--primary-light);padding:2px 10px;border-radius:20px;font-size:11px;border:1px solid rgba(59,130,246,0.2)">📌 '+q.knowledge+'</span>'
      +'<span style="font-size:11px;margin-left:auto">'+stars+'</span>'
      +'</div>'
      +'<div style="font-size:13px;color:#334155;line-height:1.6">'+q.question.substring(0,60)+'...</div>'
      +'</div></div>';
  });
  html+='</div>';

  if(pages>1){
    html+='<div style="display:flex;gap:4px;justify-content:center;padding:10px 0;flex-wrap:wrap">';
    for(let i=1;i<=pages;i++){
      html+='<button style="background:'+(i===page?'#059669':'rgba(255,255,255,0.05)')+';color:'+(i===page?'#fff':'var(--text-light)')+';border:1px solid '+(i===page?'#059669':'var(--card-border)')+';border-radius:6px;padding:4px 12px;font-size:12px;cursor:pointer" onclick="bankList('+i+')">'+i+'</button>';
    }
    html+='</div>';
  }
  el.innerHTML=html;
}

    +'</div>'
    +'<div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px">'
    +'  <span class="modal-badge" style="background:rgba(5,150,105,0.15);color:#34d399;border:1px solid rgba(5,150,105,0.2)">'+d.grade+'</span>'
    +'  <span class="modal-badge" style="background:rgba(255,255,255,0.05);color:var(--text-light)">'+d.unit+'</span>'
    +'  <span class="modal-badge" style="background:rgba(255,255,255,0.05);color:var(--text-light)">'+(d.type||'')+'</span>'
    +'  '+(d.knowledge?'<span class="modal-badge" style="background:rgba(59,130,246,0.12);color:var(--primary-light);border:1px solid rgba(59,130,246,0.2)">'+d.knowledge+'</span>':'')
    +'</div>'
    +(d.background?'<div style="font-size:12px;color:var(--text-muted);margin-bottom:10px">🏷️ <strong>背景：</strong>'+d.background+'</div>':'')
    +(d.news_bg?'<div style="font-size:11px;color:var(--text-muted);margin-bottom:8px">📰 '+d.news_bg+'</div>':'')
    +'<div class="modal-section">'
    +'  <div class="modal-section-label">📋 题目</div>'
    +'  <div class="modal-question">'+d.question+'</div>'
    +'</div>'
    +'<div class="modal-section">'
    +'  <div class="modal-section-label">✅ 答案 &amp; 解析</div>'
    +'  <div class="modal-answer">'+d.answer.replace(/\n/g,'<br>')+'</div>'
    +'</div>'
    +(!(new Set(BUILTIN_QUESTIONS.map(function(q){return q.question}))).has(d.question)
      ? '<div class="modal-actions">'
        +'<button class="modal-btn modal-btn-outline" onclick="closeModal();bankEdit('+d.id+')">✎ 编辑</button>'
        +'<button class="modal-btn modal-btn-danger" onclick="closeModal();bankDel('+d.id+')">🗑️ 删除</button>'
        +'<button class="modal-btn modal-btn-green" onclick="closeModal();bankRandomGrade(\''+d.grade+'\')">🎲 再来一题</button>'
        +'</div>'
      : '<div class="modal-actions">'
        +'<span style="flex:1;padding:10px;font-size:12px;color:var(--text-muted);text-align:center">📌 内置题不可编辑</span>'
        +'<button class="modal-btn modal-btn-green" onclick="closeModal();bankRandomGrade(\''+d.grade+'\')">🎲 再来一题</button>'
        +'</div>')
    +'</div>';

  document.body.appendChild(overlay);

  // 下一帧：触发展开动画
  requestAnimationFrame(function(){
    overlay.querySelector('.modal-content').style.transform = 'scale(1)';
  });
}

// ---- 编辑弹窗 ----
function bankEdit(id, e){
  closeModal();
  const d = getLocalBank().find(q => q.id === id);
  if(!d){ toast('题目不存在'); return; }

  var cx = window.innerWidth / 2, cy = window.innerHeight / 2;
  if(e && e.clientX){ cx = e.clientX; cy = e.clientY; }

  var overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'bankModalOverlay';
  overlay.onclick = function(evt){ if(evt.target===this) closeModal(); };

  overlay.innerHTML = '<div class="modal-content" style="transform-origin:'+cx+'px '+cy+'px;transform:scale(.3)">'
    +'<button class="modal-close" onclick="closeModal()">✕</button>'
    +'<div class="modal-header">'
    +'  <span style="font-size:22px">✎</span>'
    +'  <h3>编辑 #'+d.id+'</h3>'
    +'</div>'
    +'<div class="modal-form-grid">'
    +'  <div class="modal-form-group">'
    +'    <label>年级</label>'
    +'    <select id="editGrade">'
    +'      <option value="">选择年级</option>'
    +'      <option value="一年级">一年级</option><option value="二年级">二年级</option>'
    +'      <option value="三年级">三年级</option><option value="四年级">四年级</option>'
    +'      <option value="五年级">五年级</option><option value="六年级">六年级</option>'
    +'    </select>'
    +'  </div>'
    +'  <div class="modal-form-group">'
    +'    <label>单元</label>'
    +'    <input id="editUnit" value="'+d.unit+'" placeholder="单元">'
    +'  </div>'
    +'  <div class="modal-form-group">'
    +'    <label>题型</label>'
    +'    <input id="editType" value="'+(d.type||'')+'" placeholder="应用题">'
    +'  </div>'
    +'  <div class="modal-form-group">'
    +'    <label>难度</label>'
    +'    <input id="editDiff" value="'+d.difficulty+'" placeholder="★★★">'
    +'  </div>'
    +'</div>'
    +'<div class="modal-form-group">'
    +'  <label>题目</label>'
    +'  <textarea id="editQuestion" style="min-height:50px">'+d.question+'</textarea>'
    +'</div>'
    +'<div class="modal-form-group">'
    +'  <label>答案 &amp; 解析</label>'
    +'  <textarea id="editAnswer" style="min-height:50px">'+d.answer+'</textarea>'
    +'</div>'
    +'<div style="font-size:12px;color:var(--text-muted);margin-top:4px" id="editStatus"></div>'
    +'<div class="modal-actions" style="margin-top:10px">'
    +'  <button class="modal-btn modal-btn-primary" onclick="bankSaveEdit('+d.id+')">💾 保存修改</button>'
    +'  <button class="modal-btn modal-btn-outline" onclick="closeModal()">取消</button>'
    +'</div>'
    +'</div>';

  document.body.appendChild(overlay);
  document.getElementById('editGrade').value = d.grade;

  // 触发展开动画
  requestAnimationFrame(function(){
    overlay.querySelector('.modal-content').style.transform = 'scale(1)';
  });
}

function bankSaveEdit(id){
  const st=document.getElementById('editStatus');
  const grade=document.getElementById('editGrade').value;
  const unit=document.getElementById('editUnit').value.trim();
  const qtype=document.getElementById('editType').value.trim();
  const diff=document.getElementById('editDiff').value.trim()||'★★★';
  const question=document.getElementById('editQuestion').value.trim();
  const answer=document.getElementById('editAnswer').value.trim();
  if(!question){st.innerHTML='<span style="color:#ef4444">题目不能为空</span>';return;}
  if(!grade){st.innerHTML='<span style="color:#ef4444">请选择年级</span>';return;}

  // 在 localStorage 中更新
  const bank = getLocalBank();
  const idx = bank.findIndex(q => q.id === id);
  if(idx === -1){st.innerHTML='<span style="color:#ef4444">题目不存在</span>';return;}
  bank[idx].grade = grade;
  bank[idx].unit = unit || grade;
  bank[idx].type = qtype;
  bank[idx].difficulty = diff;
  bank[idx].question = question;
  bank[idx].answer = answer;
  saveLocalBank(bank);
  st.innerHTML='<span style="color:#059669">✅ 已保存</span>';
  setTimeout(()=>{closeModal();bankList(1);bankStats();},600);
}

// ---- 删除 ----
function bankDel(id){
  if(!confirm('确定删除这道题？')) return;
  const st = getLocalBank();
  const bank = getLocalBank();
  const newBank = bank.filter(q => q.id !== id);
  if(newBank.length === bank.length){ toast('题目不存在'); return; }
  saveLocalBank(newBank);
  toast('✅ 已删除');
  bankList(1);
  bankStats();
  closeModal();
}

// ---- 添加 ----
function loadAddGrade(){
  const sel=document.getElementById('addGrade');
  if(!sel || sel.options.length>1) return;
  BUILTIN_GRADES.forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;sel.appendChild(o)});
}
function doAdd(){
  const st=document.getElementById('addStatus');
  const grade=document.getElementById('addGrade').value;
  const unit=document.getElementById('addUnit').value.trim();
  const qtype=document.getElementById('addType').value.trim();
  const diff=document.getElementById('addDiff').value.trim()||'★★★';
  const knowledge=document.getElementById('addKnowledge').value.trim();
  const bg=document.getElementById('addBg').value.trim();
  const question=document.getElementById('addQuestion').value.trim();
  const answer=document.getElementById('addAnswer').value.trim();
  if(!grade){st.innerHTML='<span style="color:#ef4444">请选择年级</span>';return;}
  if(!question){st.innerHTML='<span style="color:#ef4444">请输入题目</span>';return;}

  const newQ = {
    id: nextLocalId(),
    grade: grade,
    unit: unit || grade,
    knowledge: knowledge || '',
    type: qtype || '应用题',
    difficulty: diff,
    question: question,
    answer: answer,
    background: bg,
    news_bg: '',
    source: '手动添加',
    created_at: new Date().toLocaleString()
  };

  if(addToLocalBank(newQ)){
    st.innerHTML='<span style="color:#059669">✅ 已添加 #'+newQ.id+'</span>';
    ['addGrade','addUnit','addType','addDiff','addKnowledge','addBg','addQuestion','addAnswer'].forEach(id=>{
      const el=document.getElementById(id); if(el) el.value=id==='addDiff'?'★★★':'';
    });
    bankStats();
  } else {
    st.innerHTML='<span style="color:#f59e0b">⚠️ 该题目已存在</span>';
  }
}

// ---- 批量导入 ----
function doBatch(){
  const st=document.getElementById('batchStatus');
  const input=document.getElementById('batchInput').value.trim();
  if(!input){st.innerHTML='<span style="color:#ef4444">请粘贴 JSON 数据</span>';return;}
  let data;
  try{data=JSON.parse(input);}catch(e){st.innerHTML='<span style="color:#ef4444">JSON 格式错误</span>';return;}
  if(!Array.isArray(data)){st.innerHTML='<span style="color:#ef4444">需要 JSON 数组</span>';return;}

  let success = 0, failed = 0;
  data.forEach(item=>{
    const qtext = item.question || item.content || '';
    if(!qtext){ failed++; return; }
    const newQ = {
      id: nextLocalId(),
      grade: item.grade || '',
      unit: item.unit || item.grade || '',
      knowledge: item.knowledge || '',
      type: item.type || '应用题',
      difficulty: item.difficulty || '★★★',
      question: qtext,
      answer: item.answer || '',
      background: item.background || '',
      news_bg: '',
      source: '批量导入',
      created_at: new Date().toLocaleString()
    };
    if(addToLocalBank(newQ)) success++; else failed++;
  });

  if(success>0) st.innerHTML='<span style="color:#059669">✅ 成功 '+success+' 条'+(failed?'，失败 '+failed+' 条':'')+'</span>';
  else st.innerHTML='<span style="color:#ef4444">❌ 全部失败</span>';
  bankStats();
}

// ---- 随机 ----
function bankRandom(){
  bankRandomGrade('');
}
function bankRandomGrade(grade){
  const bank = getLocalBank();
  const filtered = grade ? bank.filter(q => q.grade === grade) : bank;
  if(!filtered.length){ toast('题库为空'); return; }
  const rand = filtered[Math.floor(Math.random() * filtered.length)];
  bankGet(rand.id);
}

// ============================================================
// 启动
// ============================================================
init();
</script>
